<svg xmlns="http://www.w3.org/2000/svg" width="680" height="770" viewBox="0 0 680 770" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Linear model of cultivating kokoro (monochrome)</title>
<desc>Kokoro branches into two idioms, merit and energy, each with six traditions; internal critiques are dashed; both converge on Meiji–Taishō shūyō, which leads to Sōseki's Kokoro and the Usui memorial.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="770" rx="16" fill="#FFFFFF"/>
<rect x="220" y="40" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1A1A1A">Kokoro (心)</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4D4D4D">Field, register, medium</text>
<path d="M290 96 V116 H170 V134" fill="none" stroke="#1A1A1A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M390 96 V116 H510 V134" fill="none" stroke="#1A1A1A" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="136" width="260" height="56" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.75"/>
<text x="170" y="156" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1A1A1A">Merit (kudoku, ekō)</text>
<text x="170" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4D4D4D">Accrues and is transferred</text>
<rect x="380" y="136" width="260" height="56" rx="8" fill="#D4D4D4" stroke="#1A1A1A" stroke-width="0.75"/>
<text x="510" y="156" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1A1A1A">Energy (ki, kaji, tama)</text>
<text x="510" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4D4D4D">Circulates and is received</text>
<line x1="170" y1="192" x2="170" y2="214" stroke="#1A1A1A" stroke-width="1"/>
<line x1="510" y1="192" x2="510" y2="214" stroke="#1A1A1A" stroke-width="1"/>
<g font-size="14" text-anchor="middle" dominant-baseline="central">
<rect x="40" y="216" width="260" height="40" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.75"/><text x="170" y="236" fill="#1A1A1A">Ekō: merit turned to others</text>
<rect x="40" y="266" width="260" height="40" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.75"/><text x="170" y="286" fill="#1A1A1A">Genze riyaku: worldly benefit</text>
<rect x="40" y="316" width="260" height="40" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 3"/><text x="170" y="336" fill="#1A1A1A">Bodhidharma: no merit</text>
<rect x="40" y="366" width="260" height="40" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 3"/><text x="170" y="386" fill="#1A1A1A">Shinran: merit is Amida's</text>
<rect x="40" y="416" width="260" height="40" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 3"/><text x="170" y="436" fill="#1A1A1A">Dōgen: merit as enactment</text>
<rect x="40" y="466" width="260" height="40" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.75"/><text x="170" y="486" fill="#1A1A1A">Hōtoku: virtue repaid</text>
<rect x="380" y="216" width="260" height="40" rx="6" fill="#E6E6E6" stroke="#1A1A1A" stroke-width="0.75"/><text x="510" y="236" fill="#1A1A1A">Ekken: yōjō, circulating ki</text>
<rect x="380" y="266" width="260" height="40" rx="6" fill="#E6E6E6" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 3"/><text x="510" y="286" fill="#1A1A1A">Hakuin: mind lowered to belly</text>
<rect x="380" y="316" width="260" height="40" rx="6" fill="#E6E6E6" stroke="#1A1A1A" stroke-width="0.75"/><text x="510" y="336" fill="#1A1A1A">Kūkai: kaji as received grace</text>
<rect x="380" y="366" width="260" height="40" rx="6" fill="#E6E6E6" stroke="#1A1A1A" stroke-width="0.75"/><text x="510" y="386" fill="#1A1A1A">Shugendō: power verified</text>
<rect x="380" y="416" width="260" height="40" rx="6" fill="#E6E6E6" stroke="#1A1A1A" stroke-width="0.75"/><text x="510" y="436" fill="#1A1A1A">Kami cults: purified heart</text>
<rect x="380" y="466" width="260" height="40" rx="6" fill="#E6E6E6" stroke="#1A1A1A" stroke-width="0.75"/><text x="510" y="486" fill="#1A1A1A">Seishin ryōhō: healing hands</text>
</g>
<path d="M170 506 V526 H300 V544" fill="none" stroke="#1A1A1A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M510 506 V526 H380 V544" fill="none" stroke="#1A1A1A" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="190" y="546" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="340" y="566" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1A1A1A">Meiji–Taishō shūyō</text>
<text x="340" y="584" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4D4D4D">Character and health</text>
<path d="M300 602 V620 H220 V638" fill="none" stroke="#1A1A1A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M380 602 V620 H460 V638" fill="none" stroke="#1A1A1A" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="110" y="640" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="220" y="660" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1A1A1A">Sōseki, Kokoro (1914)</text>
<text x="220" y="678" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4D4D4D">Working hypotheses</text>
<rect x="350" y="640" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="460" y="660" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1A1A1A">Usui memorial (1927)</text>
<text x="460" y="678" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4D4D4D">Merit engraved in kokoro</text>
<rect x="40" y="730" width="28" height="16" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.75"/>
<text x="76" y="738" dominant-baseline="central" font-size="12" fill="#4D4D4D">Merit</text>
<rect x="130" y="730" width="28" height="16" rx="3" fill="#E6E6E6" stroke="#1A1A1A" stroke-width="0.75"/>
<text x="166" y="738" dominant-baseline="central" font-size="12" fill="#4D4D4D">Energy</text>
<rect x="228" y="730" width="28" height="16" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="264" y="738" dominant-baseline="central" font-size="12" fill="#4D4D4D">Internal critique that relocates the idiom</text>
</svg>
