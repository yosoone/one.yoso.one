<svg xmlns="http://www.w3.org/2000/svg" width="680" height="770" viewBox="0 0 680 770" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Circular model of cultivating kokoro (monochrome)</title>
<desc>Kokoro at centre; an inner ring split into merit (left) and energy (right); twelve traditions orbit on their idiom's side, with internal critiques dashed; an outer dashed boundary of Meiji–Taishō shūyō leads to Sōseki's Kokoro and the Usui memorial.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="770" rx="16" fill="#FFFFFF"/>
<circle cx="340" cy="330" r="285" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="6 4"/>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1A1A1A">Meiji–Taishō shūyō</text>
<text x="340" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4D4D4D">Absorbs both idioms</text>
<path d="M340 195 A135 135 0 0 0 340 465 L340 400 A70 70 0 0 1 340 260 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.75"/>
<text x="238" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1A1A1A">Merit</text>
<text x="238" y="340" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4D4D4D">accrues</text>
<path d="M340 195 A135 135 0 0 1 340 465 L340 400 A70 70 0 0 0 340 260 Z" fill="#D4D4D4" stroke="#1A1A1A" stroke-width="0.75"/>
<text x="442" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1A1A1A">Energy</text>
<text x="442" y="340" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4D4D4D">flows</text>
<circle cx="340" cy="330" r="62" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="340" y="312" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1A1A1A">Kokoro (心)</text>
<text x="340" y="332" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4D4D4D">Field, register,</text>
<text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4D4D4D">medium</text>
