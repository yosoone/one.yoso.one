<rect x="128" y="178" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.75"/><text x="188" y="193" fill="#1A1A1A">Genze riyaku</text>
<rect x="81" y="265" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 3"/><text x="141" y="280" fill="#1A1A1A">Bodhidharma</text>
