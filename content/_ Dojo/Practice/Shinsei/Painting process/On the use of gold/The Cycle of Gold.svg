<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-label="The cycle of gold: matter, perception, reading, practice, and back to matter, with a shadow short-circuit" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The cycle of gold — matter, perception, reading, practice</title>
<desc>A clockwise cycle of four stations: Matter (what the metal does), Perception (what the eye meets), Reading (what traditions see), Practice (what it asks), and back to Matter, since practice works the gold and refines the mind. Numbers 1 to 5 track luminosity, incorruptibility, refinement, placelessness and preciousness around the loop. A dashed short-circuit from Matter back into itself shows the shadow side: gold wanted for itself collapses the cycle into idol and vanity. At the centre, 金: each turn refines, and the painting is the trace of a turn.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1200" height="950" rx="16" fill="#FFFFFF"/>
<text x="40.0" y="44.0" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="500">The cycle of gold</text>
<text x="40.0" y="68.0" font-size="13" fill="#4D4D4D" text-anchor="start">Matter is perceived, perception is read, reading becomes practice, and practice works the matter again</text>
<path d="M 754.5 237.8 A 300 300 0 0 1 885.3 402.3" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="853.6" y="297.3" font-size="12" fill="#4D4D4D" text-anchor="start" font-style="italic">meets light</text>
<path d="M 885.3 587.7 A 300 300 0 0 1 754.5 752.2" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="853.6" y="700.7" font-size="12" fill="#4D4D4D" text-anchor="start" font-style="italic">is read as</text>
<path d="M 445.5 752.2 A 300 300 0 0 1 314.7 587.7" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="346.4" y="700.7" font-size="12" fill="#4D4D4D" text-anchor="end" font-style="italic">asks</text>
<path d="M 314.7 402.3 A 300 300 0 0 1 445.5 237.8" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="346.4" y="290.3" font-size="12" fill="#4D4D4D" text-anchor="end" font-style="italic">works the gold,</text>
<text x="346.4" y="305.3" font-size="12" fill="#4D4D4D" text-anchor="end" font-style="italic">refines the mind</text>
<rect x="460.0" y="120.0" width="280" height="150" rx="10" fill="#FFFFFF" stroke="#B08A2E" stroke-width="1.1"/>
<text x="476.0" y="146.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="500">Matter</text>
<text x="544.0" y="146.0" font-size="12" fill="#7A7A7A" text-anchor="start">what the metal does</text>
<text x="478.0" y="172.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">1</text>
<text x="492.0" y="172.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">returns light, makes none</text>
<text x="478.0" y="191.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">2</text>
<text x="492.0" y="191.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">never tarnishes or decays</text>
<text x="478.0" y="210.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">3</text>
<text x="492.0" y="210.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">purified, not destroyed, by fire</text>
<text x="478.0" y="229.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">4</text>
<text x="492.0" y="229.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">beaten into depthless leaf</text>
<text x="478.0" y="248.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">5</text>
<text x="492.0" y="248.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">rare, costly, slow to work</text>
<rect x="760.0" y="420.0" width="280" height="150" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.1"/>
<text x="776.0" y="446.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="500">Perception</text>
<text x="880.0" y="446.0" font-size="12" fill="#7A7A7A" text-anchor="start">what the eye meets</text>
<text x="778.0" y="472.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">•</text>
<text x="792.0" y="472.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">glows only at the mirror angle</text>
<text x="778.0" y="491.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">•</text>
<text x="792.0" y="491.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">changes as eye and lamp move</text>
<text x="778.0" y="510.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">•</text>
<text x="792.0" y="510.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">needs darkness to shine</text>
<text x="778.0" y="529.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">•</text>
<text x="792.0" y="529.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">seems lit from within</text>
<text x="778.0" y="548.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">•</text>
<text x="792.0" y="548.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">flat leaf cancels depth</text>
<rect x="460.0" y="720.0" width="280" height="150" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.1"/>
<text x="476.0" y="746.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="500">Reading</text>
<text x="553.0" y="746.0" font-size="12" fill="#7A7A7A" text-anchor="start">what traditions see in it</text>
<text x="478.0" y="772.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">1</text>
<text x="492.0" y="772.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">divine light, the golden word</text>
<text x="478.0" y="791.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">2</text>
<text x="492.0" y="791.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">the deathless, flesh of gold</text>
<text x="478.0" y="810.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">3</text>
<text x="492.0" y="810.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">the freed mind, tried in fire</text>
<text x="478.0" y="829.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">4</text>
<text x="492.0" y="829.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">heaven as no-where</text>
<text x="478.0" y="848.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">5</text>
<text x="492.0" y="848.0" font-size="12.5" fill="#1A1A1A" text-anchor="start">offering and merit</text>
<rect x="160.0" y="420.0" width="280" height="150" rx="10" fill="#EFE2BE" stroke="#B08A2E" stroke-width="1.1"/>
<text x="176.0" y="446.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="500">Practice</text>
<text x="262.0" y="446.0" font-size="12" fill="#7A7A7A" text-anchor="start">what it asks</text>
<text x="178.0" y="472.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">1</text>
<text x="192.0" y="472.0" font-size="12.5" fill="#8A6A1F" text-anchor="start" font-style="italic">turn toward the light</text>
<text x="178.0" y="491.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">2</text>
<text x="192.0" y="491.0" font-size="12.5" fill="#8A6A1F" text-anchor="start" font-style="italic">seek what does not decay</text>
<text x="178.0" y="510.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">3</text>
<text x="192.0" y="510.0" font-size="12.5" fill="#8A6A1F" text-anchor="start" font-style="italic">radiance by subtraction</text>
<text x="178.0" y="529.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">4</text>
<text x="192.0" y="529.0" font-size="12.5" fill="#8A6A1F" text-anchor="start" font-style="italic">loosen measured space</text>
<text x="178.0" y="548.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="500">5</text>
<text x="192.0" y="548.0" font-size="12.5" fill="#8A6A1F" text-anchor="start" font-style="italic">the work as a gift</text>
<path d="M 560.0 272.0 C 530.0 355.0, 670.0 355.0, 640.0 275.0" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="600.0" y="370.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="500">shadow: gold wanted for itself</text>
<text x="600.0" y="388.0" font-size="12" fill="#4D4D4D" text-anchor="middle">the cycle collapses onto the metal → idol, vanity</text>
<text x="600.0" y="406.0" font-size="12" fill="#8A6A1F" text-anchor="middle" font-style="italic">answer: gold in its place, sparing and half-hidden</text>
<text x="600.0" y="529.0" font-size="64" fill="#B08A2E" text-anchor="middle">金</text>
<text x="600.0" y="567.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-style="italic">each turn refines</text>
<text x="600.0" y="585.0" font-size="12" fill="#4D4D4D" text-anchor="middle">the painting is the trace of a turn</text>
<text x="40.0" y="934.0" font-size="11" fill="#7A7A7A" text-anchor="start">Numbers follow one quality around the cycle. Practice lines are Shinsei readings, not quotations. Detail: The Spirit of Gold · The Aesthetic of Gold.</text>
</svg>
