<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-label="The cycle of practice: mind at the centre, five movements around it, each mirrored by gold" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The cycle of practice — mind at the centre, gold as mirror</title>
<desc>Mind in practice sits at the centre (心: meditation, Reiki, the brush). Around it, a clockwise cycle of five movements: Refine (release the five hindrances), Turn toward light, Loosen space, Touch what lasts, Offer; then back to Refine. Between them the mind becomes pliant and malleable, luminous, open, steady, and leaves a trace before beginning again. On the outer ring, gold mirrors each movement: purified by fire, returns light, depthless leaf, never tarnishes, given as offering. A dashed loop at the core marks the shadow, grasping the glow; a dotted arrow from Offer reaches the viewer as resonance, a consequence not a goal.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1200" height="960" rx="16" fill="#FFFFFF"/>
<text x="40.0" y="44.0" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="500">The cycle of practice</text>
<text x="40.0" y="68.0" font-size="13" fill="#4D4D4D" text-anchor="start">Mind at the centre. Each movement of practice is mirrored by something gold does, on the outer ring.</text>
<path d="M 713.9 289.2 A 280 280 0 0 1 844.9 409.3" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="779.9" y="301.4" font-size="12" fill="#4D4D4D" text-anchor="start" font-style="italic">pliant, malleable</text>
<path d="M 877.6 508.5 A 280 280 0 0 1 817.6 721.2" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="891.0" y="643.6" font-size="12" fill="#4D4D4D" text-anchor="start" font-style="italic">luminous</text>
<path d="M 651.0 820.3 A 280 280 0 0 1 549.0 820.3" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="600.0" y="855.0" font-size="12" fill="#4D4D4D" text-anchor="middle" font-style="italic">open</text>
<path d="M 382.4 721.2 A 280 280 0 0 1 322.4 508.5" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="309.0" y="643.6" font-size="12" fill="#4D4D4D" text-anchor="end" font-style="italic">steady</text>
<path d="M 355.1 409.3 A 280 280 0 0 1 486.1 289.2" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="420.1" y="294.4" font-size="12" fill="#4D4D4D" text-anchor="end" font-style="italic">trace left,</text>
<text x="420.1" y="309.4" font-size="12" fill="#4D4D4D" text-anchor="end" font-style="italic">begin again</text>
<rect x="493.0" y="222.0" width="214" height="86" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.1"/>
<circle cx="515.0" cy="248.0" r="10" fill="#1A1A1A"/>
<text x="515.0" y="252.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="500">1</text>
<text x="533.0" y="253.0" font-size="14.5" fill="#1A1A1A" text-anchor="start" font-weight="500">Refine</text>
<text x="509.0" y="282.0" font-size="12" fill="#4D4D4D" text-anchor="start">release the five hindrances</text>
<line x1="600.0" y1="214.0" x2="600.0" y2="153.0" stroke="#B08A2E" stroke-width="1" stroke-dasharray="3 3"/>
<text x="600.0" y="115.0" font-size="12.5" fill="#8A6A1F" text-anchor="middle" font-style="italic">purified by fire,</text>
<text x="600.0" y="131.0" font-size="12.5" fill="#8A6A1F" text-anchor="middle" font-style="italic">not destroyed</text>
<rect x="759.3" y="415.5" width="214" height="86" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.1"/>
<circle cx="781.3" cy="441.5" r="10" fill="#1A1A1A"/>
<text x="781.3" y="446.0" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="500">2</text>
<text x="799.3" y="446.5" font-size="14.5" fill="#1A1A1A" text-anchor="start" font-weight="500">Turn toward light</text>
<text x="775.3" y="475.5" font-size="12" fill="#4D4D4D" text-anchor="start">receive light, don’t make it</text>
<line x1="975.7" y1="422.9" x2="991.8" y2="417.7" stroke="#B08A2E" stroke-width="1" stroke-dasharray="3 3"/>
<text x="997.5" y="411.8" font-size="12.5" fill="#8A6A1F" text-anchor="start" font-style="italic">returns light,</text>
<text x="997.5" y="427.8" font-size="12.5" fill="#8A6A1F" text-anchor="start" font-style="italic">makes none</text>
<rect x="657.6" y="728.5" width="214" height="86" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.1"/>
<circle cx="679.6" cy="754.5" r="10" fill="#1A1A1A"/>
<text x="679.6" y="759.0" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="500">3</text>
<text x="697.6" y="759.5" font-size="14.5" fill="#1A1A1A" text-anchor="start" font-weight="500">Loosen space</text>
<text x="673.6" y="788.5" font-size="12" fill="#4D4D4D" text-anchor="start">rest where there is no place</text>
<line x1="794.6" y1="812.8" x2="842.2" y2="878.3" stroke="#B08A2E" stroke-width="1" stroke-dasharray="3 3"/>
<text x="845.7" y="879.2" font-size="12.5" fill="#8A6A1F" text-anchor="start" font-style="italic">beaten into</text>
<text x="845.7" y="895.2" font-size="12.5" fill="#8A6A1F" text-anchor="start" font-style="italic">depthless leaf</text>
<rect x="328.4" y="728.5" width="214" height="86" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.1"/>
<circle cx="350.4" cy="754.5" r="10" fill="#1A1A1A"/>
<text x="350.4" y="759.0" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="500">4</text>
<text x="368.4" y="759.5" font-size="14.5" fill="#1A1A1A" text-anchor="start" font-weight="500">Touch what lasts</text>
<text x="344.4" y="788.5" font-size="12" fill="#4D4D4D" text-anchor="start">the undecaying beneath change</text>
<line x1="405.4" y1="812.8" x2="357.8" y2="878.3" stroke="#B08A2E" stroke-width="1" stroke-dasharray="3 3"/>
<text x="354.3" y="879.2" font-size="12.5" fill="#8A6A1F" text-anchor="end" font-style="italic">never tarnishes</text>
<text x="354.3" y="895.2" font-size="12.5" fill="#8A6A1F" text-anchor="end" font-style="italic">or decays</text>
<rect x="226.7" y="415.5" width="214" height="86" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.1"/>
<circle cx="248.7" cy="441.5" r="10" fill="#1A1A1A"/>
<text x="248.7" y="446.0" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="500">5</text>
<text x="266.7" y="446.5" font-size="14.5" fill="#1A1A1A" text-anchor="start" font-weight="500">Offer</text>
<text x="242.7" y="475.5" font-size="12" fill="#4D4D4D" text-anchor="start">the work as a gift</text>
<line x1="224.3" y1="422.9" x2="208.2" y2="417.7" stroke="#B08A2E" stroke-width="1" stroke-dasharray="3 3"/>
<text x="202.5" y="411.8" font-size="12.5" fill="#8A6A1F" text-anchor="end" font-style="italic">rare, and given</text>
<text x="202.5" y="427.8" font-size="12.5" fill="#8A6A1F" text-anchor="end" font-style="italic">as offering</text>
<circle cx="600" cy="545" r="100" fill="#EFE2BE" stroke="#B08A2E" stroke-width="1.5"/>
<text x="600.0" y="549.0" font-size="54" fill="#1A1A1A" text-anchor="middle">心</text>
<text x="600.0" y="581.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="500">mind in practice</text>
<text x="600.0" y="600.0" font-size="11" fill="#4D4D4D" text-anchor="middle">meditation · Reiki · the brush</text>
<path d="M 578 444 C 550 409, 650 409, 622 441" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="600.0" y="383.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="500">shadow: grasping the glow</text>
<text x="600.0" y="399.0" font-size="11.5" fill="#4D4D4D" text-anchor="middle">radiance made an achievement → let it go</text>
<line x1="222.7" y1="491.5" x2="150" y2="571.5" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
<text x="150.0" y="591.5" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="500">the viewer: resonance</text>
<text x="150.0" y="607.5" font-size="11.5" fill="#4D4D4D" text-anchor="middle">a consequence, not a goal</text>
<text x="40.0" y="944.0" font-size="11" fill="#7A7A7A" text-anchor="start">Outer ring (gold): what the metal does that mirrors each movement. Arc labels: what the mind becomes (AN 5.23: pliant, malleable, luminous). Movements are Shinsei readings. Companion: The Cycle of Gold.</text>
</svg>
