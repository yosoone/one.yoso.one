<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="c1"><rect x="60" y="96" width="240" height="520"/></clipPath>
    <clipPath id="c2"><rect x="360" y="96" width="240" height="520"/></clipPath>
    <clipPath id="c3"><rect x="660" y="96" width="240" height="520"/></clipPath>

    <filter id="dust" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="17" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.72
                0 0 0 0 0.57
                0 0 0 0 0.18
                2.2 0 0 0 -1.15"/>
    </filter>

    <filter id="dust2" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="1" seed="42" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.85
                0 0 0 0 0.70
                0 0 0 0 0.36
                2.0 0 0 0 -1.05"/>
    </filter>

    <radialGradient id="fade" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.12"/>
    </radialGradient>
    <mask id="m2"><rect x="360" y="96" width="240" height="520" fill="url(#fade)"/></mask>
    <mask id="m3"><rect x="660" y="96" width="240" height="520" fill="url(#fade)"/></mask>

    <g id="splash">
      <path d="M 0 -62 C 20 -66 34 -54 40 -36 C 48 -20 66 -16 68 0 C 70 16 52 22 44 36 C 36 52 20 64 2 62 C -16 60 -30 48 -38 34 C -46 20 -64 12 -62 -4 C -60 -20 -44 -26 -36 -40 C -28 -54 -16 -60 0 -62 Z" fill="#14110f"/>
      <ellipse cx="-78" cy="-52" rx="5" ry="6" fill="#14110f" opacity="0.8"/>
      <ellipse cx="72" cy="-66" rx="3.5" ry="4" fill="#14110f" opacity="0.7"/>
      <ellipse cx="92" cy="28" rx="6" ry="5" fill="#14110f" opacity="0.75"/>
      <ellipse cx="-92" cy="44" rx="4" ry="5" fill="#14110f" opacity="0.65"/>
      <ellipse cx="14" cy="96" rx="5.5" ry="6.5" fill="#14110f" opacity="0.8"/>
      <ellipse cx="-42" cy="-92" rx="3" ry="3.5" fill="#14110f" opacity="0.6"/>
      <ellipse cx="56" cy="88" rx="2.5" ry="3" fill="#14110f" opacity="0.55"/>
      <ellipse cx="-104" cy="-6" rx="2.5" ry="2.5" fill="#14110f" opacity="0.5"/>
      <ellipse cx="34" cy="-102" rx="2" ry="2.5" fill="#14110f" opacity="0.45"/>
      <ellipse cx="-20" cy="128" rx="3" ry="3" fill="#14110f" opacity="0.5"/>
      <ellipse cx="100" cy="-34" rx="2" ry="2" fill="#14110f" opacity="0.4"/>
      <ellipse cx="-66" cy="96" rx="2" ry="2.5" fill="#14110f" opacity="0.4"/>
    </g>
  </defs>

  <rect width="960" height="700" fill="#fbfaf7"/>

  <text x="480" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#3a332c">Gradations of Consciousness</text>
  <text x="480" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3a332c" opacity="0.65">Three kakejiku &#183; Shinsei</text>

  <!-- I. ASSAULT -->
  <g>
    <rect x="44" y="70" width="272" height="572" fill="#e6ded0"/>
    <rect x="60" y="96" width="240" height="520" fill="#f7f4ec"/>
    <g clip-path="url(#c1)">
      <use href="#splash" x="180" y="336" opacity="0.14" transform="translate(180 336) scale(1.28) translate(-180 -336)"/>
      <g transform="translate(180 336)"><use href="#splash"/></g>
      <rect x="60" y="96" width="7" height="520" fill="#b8912f" opacity="0.92"/>
      <rect x="293" y="96" width="7" height="520" fill="#b8912f" opacity="0.92"/>
      <rect x="60" y="96" width="240" height="6" fill="#d9b45c" opacity="0.78"/>
      <rect x="60" y="610" width="240" height="6" fill="#d9b45c" opacity="0.78"/>
    </g>
    <rect x="34" y="56" width="292" height="10" rx="5" fill="#5d4a37"/>
    <rect x="34" y="642" width="292" height="14" rx="7" fill="#5d4a37"/>
    <text x="180" y="686" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#3a332c">I &#183; Assault</text>
  </g>

  <!-- II. SOFT GRACE -->
  <g>
    <rect x="344" y="70" width="272" height="572" fill="#e6ded0"/>
    <rect x="360" y="96" width="240" height="520" fill="#f7f4ec"/>
    <g clip-path="url(#c2)" mask="url(#m2)">
      <rect x="360" y="96" width="240" height="520" filter="url(#dust)"/>
      <rect x="360" y="96" width="240" height="520" filter="url(#dust2)" opacity="0.7"/>
    </g>
    <rect x="334" y="56" width="292" height="10" rx="5" fill="#5d4a37"/>
    <rect x="334" y="642" width="292" height="14" rx="7" fill="#5d4a37"/>
    <text x="480" y="686" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#3a332c">II &#183; Soft Grace</text>
  </g>

  <!-- III. RECOGNITION -->
  <g>
    <rect x="644" y="70" width="272" height="572" fill="#e6ded0"/>
    <rect x="660" y="96" width="240" height="520" fill="#f7f4ec"/>
    <g clip-path="url(#c3)">
      <g mask="url(#m3)">
        <rect x="660" y="96" width="240" height="520" filter="url(#dust)" opacity="0.85"/>
      </g>
      <use href="#splash" transform="translate(780 336) scale(1.24) translate(-780 -336) translate(780 336)" opacity="0.12"/>
      <g transform="translate(780 336)"><use href="#splash" opacity="0.93"/></g>
      <g mask="url(#m3)">
        <rect x="660" y="96" width="240" height="520" filter="url(#dust2)" opacity="0.9"/>
      </g>
    </g>
    <rect x="634" y="56" width="292" height="10" rx="5" fill="#5d4a37"/>
    <rect x="634" y="642" width="292" height="14" rx="7" fill="#5d4a37"/>
    <text x="780" y="686" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#3a332c">III &#183; Recognition</text>
  </g>
</svg>
